<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wraith HUD</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <!-- the w_crafting theme: local RDR fonts + a dark identity + Arabic/English support (beats styles.css) -->
    <link rel="stylesheet" href="css/theme.css" />
    <script>
      // RTL direction for Arabic (the client sends it via SendNUIMessage action='setLang')
      window.addEventListener('message', function (e) {
        var d = e.data || {};
        if (d.action === 'setLang') {
          document.documentElement.dir = (d.lang === 'ar') ? 'rtl' : 'ltr';
          document.documentElement.lang = d.lang || 'en';
        }
      });
    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/dseg">

    <link
