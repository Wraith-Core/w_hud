<!DOCTYPE html>
<html lang="en" style="background: transparent !important; background-color: transparent !important;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ريد ريفر · الواجهة</title>
  <script>
    /* Catch any JS error and show it on screen (the CEF console is unavailable in game) */
    window.addEventListener('error', function (e) {
      var d = document.getElementById('__diag');
      if (d) { d.style.color = '#F2F2F2'; d.style.borderColor = '#CB0101';
        d.textContent = 'w_hud JS ERROR: ' + (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''); }
    });
    window.addEventListener('unhandledrejection', function (e) {
      var d = document.getElementById('__diag');
      if (d) { d.style.color = '#F2F2F2'; d.style.borderColor = '#CB0101';
        d.textContent = 'w_hud PROMISE REJECT: ' + ((e.reason && e.reason.message) || e.reason); }
    });
    /* Early language/direction (RTL) -- the same message React consumes (src/i18n.ts) */
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.action === 'setLocale') {
        document.documentElement.dir = (d.dir === 'rtl' || d.locale === 'ar') ? 'rtl' : 'ltr';
        document.documentElement.lang = (d.locale === 'ar') ? 'ar' : 'en';
      }
    });
  </script>
  
  <script type="module" src="./assets/app.js"></script>
  <link rel="stylesheet" href="./assets/app.css">
<link rel="stylesheet" href="https://cfx-nui-w_lib/nui/assets/store-theme.css" data-wraith-store-theme />
</head>
<body class="wst-root wst-app-hud" style="background: transparent !important; background-color: transparent !important;">
  <!-- Temporary diagnostic marker: proves the page loaded inside NUI (removed later) -->
  <div id="__diag" style="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99999;background:rgba(10,10,10,.88);color:#F2F2F2;font:12px monospace;padding:6px 10px;border:1px solid rgba(242,242,242,.32);border-radius:4px;max-width:90vw;white-space:pre-wrap;pointer-events:none;">w_hud: PAGE LOADED (HTML ok) -- waiting for JS...</div>
  <div id="root"></div>
</body>
</html>
